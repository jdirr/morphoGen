[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "morphogen"
dynamic = ["version"]
description = "Morphological modelling and generation of virtual microstructures for RVE studies"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Justin Dirrenberger" }]
keywords = [
    "microstructure",
    "random media",
    "mathematical morphology",
    "representative volume element",
    "homogenization",
    "finite elements",
    "FFT",
    "Boolean model",
    "Voronoi",
    "TPMS",
    "cellular automata",
    "metamaterials",
    "topology optimization",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    # Not published before the public release (roadmap phase 4): this classifier
    # makes PyPI refuse any accidental upload.
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "numba>=0.60",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Marching cubes for surface meshes (STL).
surface = ["scikit-image>=0.22"]
# Extra file formats: TIFF stacks, and any mesh format supported by meshio.
io = ["tifffile>=2024.1", "meshio>=5.3"]
# Figures (RVE studies, sections, 3D views, histories) and animations (Pillow, a
# dependency of matplotlib).
plot = ["matplotlib>=3.8"]
# Videos and 3D views: VTK (off-screen rendering) and a bundled ffmpeg (if none on the PATH).
video = ["vtk>=9.3", "imageio-ffmpeg>=0.4"]
# Conforming tetrahedral meshes (MMG mesher, LGPL), used by the finite element solver.
# Binary wheels for Windows, macOS and Linux x86-64; elsewhere, install mmg3d and set
# MORPHOGEN_MMG3D.
mesh = ["pymmg>=1.0; platform_machine != 'aarch64'"]
all = ["morphogen[surface,io,plot,mesh]"]
# The stand-alone application (morphogen desktop, morphogen-desktop): the interface in a
# window of its own through pywebview, with the web engine of the system (WebView2 on
# Windows, WebKit on macOS); on Linux, Qt WebEngine from its wheels.
desktop = ["pywebview>=5.0", "pywebview[qt]>=5.0; sys_platform == 'linux'"]
# The FFT solvers on NVIDIA GPUs (morphogen.gpu): CuPy, the CUDA runtime, NVRTC and cuFFT
# (no CUDA toolkit needed; drivers of CUDA 13 or later, cupy-cuda12x otherwise).
gpu = ["cupy-cuda13x>=14", "cuda-toolkit[cudart,nvrtc,cufft]==13.*"]
# scikit-fem: independent finite element reference in the tests; pytest-xdist runs them
# in parallel (`-n auto`).
test = ["pytest>=8.0", "pytest-xdist>=3.6", "scikit-fem>=10"]
# The documentation site (docs/, `python -m sphinx docs site`): Markdown pages (MyST),
# the API reference from the docstrings.
docs = ["morphogen[all]", "sphinx>=8.1", "myst-parser>=4.0", "furo>=2024.8"]
dev = ["morphogen[all,test,docs]", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
morphogen = "morphogen.cli:main"

[project.gui-scripts]
# the stand-alone application (no console window on Windows)
morphogen-desktop = "morphogen.gui.desktop:main"

[project.urls]
Repository = "https://github.com/jdirr/morphoGen"
Documentation = "https://jdirr.github.io/morphoGen/"

[tool.hatch.version]
path = "src/morphogen/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/morphogen",
    "tests",
    "examples",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "CONTRIBUTING.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/morphogen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: the longest tests (15 s or more), which the CIs run under one Python only",
]
filterwarnings = [
    "error::DeprecationWarning:morphogen.*",
    "ignore::DeprecationWarning:skimage.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = [
    "E741",   # short names such as l, I are standard notation in the formulas
    "RUF001", # Greek letters in strings and docstrings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# model parameters are declared with param(), a wrapper of dataclasses.field
extend-immutable-calls = ["morphogen.models.base.param"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.coverage.run]
source = ["morphogen"]
