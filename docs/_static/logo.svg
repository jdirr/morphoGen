<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="morphoGen">
  <title>morphoGen</title>
  <!-- A periodic cell of a random medium: the grains that a face cuts come back through
       the opposite face (the period is the edge of the cell, 56). -->
  <defs>
    <clipPath id="cell">
      <rect x="4" y="4" width="56" height="56" rx="9"/>
    </clipPath>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="9" fill="#ecece6"/>
  <g clip-path="url(#cell)">
    <g fill="#1f4e79">
      <circle cx="23" cy="26" r="11"/>
      <circle cx="46" cy="43" r="9"/>
      <circle cx="58" cy="15" r="8"/>
      <circle cx="2" cy="15" r="8"/>
      <circle cx="21" cy="60" r="8"/>
      <circle cx="21" cy="4" r="8"/>
    </g>
    <circle cx="41" cy="20" r="5" fill="#d6604d"/>
  </g>
  <rect x="4" y="4" width="56" height="56" rx="9" fill="none" stroke="#1f4e79" stroke-width="2.5"/>
</svg>
