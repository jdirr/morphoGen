# The documentation site on Read the Docs (docs/release.md, step 7): Sphinx with the
# configuration of docs/, the package installed with its extra [docs], warnings as errors.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
