# Pores in a cast alloy under a tension that alternates: where will fatigue start, and
# how far is the alloy from its limit? The cell stays elastic (high-cycle fatigue): the
# stresses of its points along one cycle are judged by Dang Van's criterion, calibrated
# on the fatigue limits of the alloy in alternating bending and torsion. A pore doubles
# the stress at its equator: there the utilization (the equivalent stress over the
# limit) is the largest, and its inverse is the factor by which the loading may grow
# before a point reaches its limit. The file pores_0000_cycle_periodic_fatigue.vtu maps
# the utilization, the amplitude of the shear and the largest pressure; the results
# have the largest utilization, the factor of safety and the share of the alloy beyond
# its limit. About a minute.
model:
  type: hardcore_spheres       # the pores (phase 1)
  radius: 0.5
  volume_fraction: 0.04
domain:
  size: 4.0
  periodic: true
seed: 5
mesh:
  size: 0.35                   # 10-node tetrahedra of the alloy alone, curved on the pores
homogenization:
  method: fe
  materials:
    0: {young: 72000.0, poisson: 0.33}   # the alloy (MPa)
    1: void
  properties: []
  paths:
    cycle:                     # a stress of 40 that alternates; free components: zero stress
      times: [0, 1, 2, 3]
      increments: [1, 2, 2]
      stress: {"11": [0, 40, -40, 40]}
  fatigue:
    criterion: dang_van        # crossland | sines | dang_van | findley | matake
    bending: 110.0             # the fatigue limits of the alloy, alternating bending
    torsion: 80.0              # and torsion (or the coefficients: alpha, beta)
    cycle: [1, 3]              # from the first peak on: the rise from zero is left out
outputs:
  directory: out/homogenization_fatigue
  name: pores
  conforming_mesh: [vtu]
