# Trabecular bone, or an open-cell foam: struts along the edges of the periodic Voronoi
# tessellation of relaxed germs (Lloyd iterations: even cells), elongated by 1.6 along
# z (the main load), with thicker nodes, at 15 % relative density (reached on each
# realization). Its stiffness scales as the square of the density (Gibson and Ashby),
# larger along the elongation.
model:
  type: open_foam
  n_cells: 64
  volume_fraction: 0.15        # or strut_radius
  relaxation: 10
  anisotropy: 1.6
  axis: 2
  node_ratio: 1.3
domain:
  size: 1.0
  periodic: true
seed: 3
voxels:
  shape: 96
homogenization:
  method: fft
  materials:
    0: void
    1: {young: 18.0, poisson: 0.3}       # bone tissue (GPa)
  properties: [stiffness]
outputs:
  directory: out/trabecular_bone
  name: trabecular
analysis: [volume_fraction, connectivity]
