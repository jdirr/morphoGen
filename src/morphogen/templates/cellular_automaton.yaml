# Bicontinuous two-phase structure coarsened by a cellular automaton: Vichniac's twisted
# majority rule ("anneal") moves the interfaces of random noise by their mean curvature,
# like the annealing of a binary alloy. Other rules: majority, conserved (coarsening at
# constant volume fraction), clouds (cave-like structures) or any B.../S... rule.
model:
  type: cellular_automaton
  rule: anneal
  neighbourhood: moore         # von_neumann, moore, edges or euclidean
  steps: 40
  initial_fraction: 0.5
  cell_size: 0.25              # a lattice of 64^3 cells
  smoothing: 0.75              # rounded interfaces at other resolutions and in meshes
domain:
  size: 16.0
  periodic: true
seed: 1984
voxels:
  shape: 64                    # one voxel per cell: the lattice itself
outputs:
  directory: out/cellular_automaton
  name: anneal
  geometry: [json]             # exact lattice: re-voxelize or mesh it later
  image: [vti]
  level_set: [vti]
analysis: [volume_fraction, specific_surface, connectivity]
