# A piezoelectric composite: barium titanate particles poled along x3 in a polymer (SI
# units). The displacement and the electric potential are solved together on the voxels
# (a strong coupling: MINRES preconditioned in Fourier space); the results are the
# tensors of the effective law (stiffness, piezoelectric matrix e, permittivity) and its
# constants: d33, g33, the hydrostatic coefficients d_h and g_h, the coupling factors.
model:
  type: boolean_spheres
  radius: 1.0
  volume_fraction: 0.3
domain:
  size: 6.0
  periodic: true
seed: 11
voxels:
  shape: 16
homogenization:
  method: fft
  materials:
    0: {young: 4.0e+9, poisson: 0.35, permittivity: 3.7e-11}        # polymer
    1:                                                               # BaTiO3 (Li & Dunn 1998)
      hexagonal: [166.0e+9, 77.0e+9, 78.0e+9, 162.0e+9, 43.0e+9]
      permittivity: [11.2e-9, 11.2e-9, 12.6e-9]
      coupling: {piezoelectric: {e31: -4.4, e33: 18.6, e15: 11.6}}   # C/m^2
  properties: [piezoelectric]
outputs:
  directory: out/homogenization_piezoelectric
  name: composite
