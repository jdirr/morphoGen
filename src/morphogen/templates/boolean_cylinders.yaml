# Boolean model of finite fibres (cylinders or spherocylinders).
model:
  type: boolean_cylinders
  radius: 0.5
  length: 8.0
  orientation: isotropic       # or {type: aligned, direction: [0, 0, 1]} / {type: planar, normal: [0, 0, 1]}
  caps: flat                   # flat | round
  volume_fraction: 0.15
domain:
  size: 30.0
  periodic: true
seed: 1
voxels:
  voxel_size: 0.15
outputs:
  directory: out/boolean_cylinders
  name: fibres
  geometry: [json]
  image: [vti]
analysis: [volume_fraction, specific_surface, connectivity]
