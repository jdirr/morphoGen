# Cleavage that the slip nucleates. A polycrystal of iron on voxels whose grains slip on
# their {110}<111> systems well below the strength of their {100} cleavage planes: with
# a constant strength it would yield, harden and never cleave until the stress of a
# grain came to that strength - slip shields cleavage. Here the slip of a crystal lowers
# the strength of its planes, as exp(-coupling x cumulated slip) (the coupling of
# plasticity and damage of Aslan et al. 2011), and their damage eases its slip in return:
# the polycrystal yields at some 430 MPa, hardens, and breaks across a section once its
# grains have slipped enough: at 594 MPa and 1.6 %, for 682 MPa and 2.4 % without the
# coupling (coupling: 0), where it breaks when the stress of a grain comes to the
# strength of its planes. The curve (iron_0000_tension_periodic.csv) has the plastic
# strain, the opening and the damage of the planes; the fields (.vti) those of each
# voxel. A minute.
model:
  type: voronoi
  n_cells: 8
  crystal_orientations: true
domain:
  size: 0.1                    # mm: grains of some 50 micrometres
  periodic: true
seed: 2
voxels:
  shape: 10
homogenization:
  method: fft
  materials:
    1:
      cubic: [230000.0, 135000.0, 117000.0]   # C11, C12, C44 of iron (MPa)
      crystal_plasticity:
        K: 10.0
        n: 10.0
        families:
          bcc110: {tau0: 150.0, Q: 100.0, b: 20.0}   # a slip far below the cleavage
        cleavage:
          planes: cube         # {100}
          strength: 800.0      # the normal stress that opens a plane that has not slipped (MPa)
          coupling: 5.0        # the strength falls as exp(-coupling x cumulated slip)
          energy: 0.08         # the fracture energy of the planes (N/mm)
          length: 0.01         # the size of the voxels that dissipate it (size / shape)
          K: 50.0              # a viscosity of the opening: the crack crosses the cell at
          n: 1.0               # once (a snap-back), the steps pass with it
  properties: []
  fields: true
  paths:
    tension:                   # the other components: zero stress
      times: [0, 1]
      increments: 40
      strain: {"33": [0, 0.04]}
outputs:
  directory: out/homogenization_slip_cleavage
  name: iron
