# Grains of the plane grown from elliptical seeds (the seeds of the plane of MicroStructPy):
# the section of a rolled sheet, grains of lognormal sizes elongated along x (phase 1) and
# a second phase of smaller equiaxed grains (phase 0), columnar through a slice one voxel
# thick; the grains checked against their seeds (exact_grains: the ellipses of their
# sections).
model:
  type: seeded_laguerre
  dimension: 2
  phase_fractions: [0.2, 0.8]
  phase_diameter: [0.06, {type: lognormal, mean: 0.12, std: 0.03}]
  phase_aspect_ratio: [1.0, {type: uniform, low: 2.0, high: 3.5}]
  phase_orientation: [random, aligned]
  crystal_orientations: true
domain:
  size: [1.0, 1.0, 0.00390625]   # a slice one voxel thick
  periodic: true
seed: 1
voxels:
  shape: [256, 256, 1]
outputs:
  directory: out/seeded_plane
  name: sheet
  image: [vti]
  labels: [vti]
analysis: [phase_fractions, exact_grains]
