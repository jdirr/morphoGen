# The cleavage of a polycrystal. A polycrystal of iron at a low temperature on voxels:
# each grain a cubic crystal that slips on its {110}<111> systems, hard, and whose {100}
# planes cleave: a plane opens when its normal stress is its strength, and its strength
# then falls with its opening, the fracture energy of the planes being dissipated in a
# band of one voxel (the crack band: energy and length). Pulled, the polycrystal is
# elastic up to the strength of its best oriented planes, then a crack crosses its
# grains from plane to plane: the stress falls, and the work that broke the cell is a
# few times the fracture energy times its section (the planes of the grains are
# inclined: steps, bridges). With a softer slip (tau0: 150), the grains flow before
# their planes open: slip shields cleavage, the ductile-to-brittle transition. The
# curve (iron_0000_tension_periodic.csv) has the opening and the damage of the planes;
# the fields (.vti) those of each voxel. Half a minute.
model:
  type: voronoi
  n_cells: 8
  crystal_orientations: true
domain:
  size: 0.1                    # mm: grains of some 50 micrometres
  periodic: true
seed: 2
voxels:
  shape: 12
homogenization:
  method: fft
  materials:
    1:
      cubic: [230000.0, 135000.0, 117000.0]   # c11, c12, c44 (MPa)
      crystal_plasticity:
        K: 10.0
        n: 10.0
        families:
          bcc110: {tau0: 300.0, Q: 100.0, b: 20.0}   # hard: a low temperature
        cleavage:
          planes: cube         # {100}; also dodecahedral {110}, octahedral {111}
          strength: 500.0      # the normal stress that opens a plane (MPa)
          energy: 0.05         # the fracture energy of the planes (N/mm)
          length: 0.00833      # the size of the voxels that dissipate it (size / shape)
          K: 50.0              # a viscosity of the opening: the crack crosses the cell at
          n: 1.0               # once (a snap-back), the steps pass with it
          # coupling: 5.0      # the strength falls as exp(-coupling x cumulated slip): the
                               # slip nucleates the cleavage (a softer slip, stronger planes)
  properties: []
  fields: true
  paths:
    tension:                   # the other components: zero stress
      times: [0, 1]
      increments: 40
      strain: {"33": [0, 0.01]}
outputs:
  directory: out/homogenization_cleavage
  name: iron
