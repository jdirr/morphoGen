# Scale-rich network of plates in three dimensions (Both, Chen, ..., Portela & Barabási,
# Nature 659, 345, 2026, Fig. 6a): plates lambda_0 t^-alpha thick grown one after another
# from points of the voids until they meet, each splitting a convex void into two closed
# cells, so that the areas and degrees of the plates have power-law tails of exponent 5/2.
# element: beams grows struts until they touch instead (open cells).
model:
  type: scale_rich_network
  dimension: 3
  element: plates              # or beams: struts, open cells
  n_ligaments: 400             # T plates
  decay: 0.3                   # alpha: 0 uniform thicknesses, 0.9 a few thick plates
  volume_fraction: 0.3         # solved on each realization (or initial_thickness: 0.04)
  # orientation: {type: aligned, direction: [0, 0, 1]}  # layers (default: isotropic)
  # pole: [0.5, 0.5, 0.5]      # polarized normals: at pole_angle to the direction...
  # pole_angle: 90             # ...of the pole, here shells about it
  # nucleation_gradient: [1, 4]  # nucleation four times denser at the top...
  # gradient_axis: 2           # ...along z
  # frame: 0.02                # a closed box: the sample as the cell of a periodic medium
domain:
  size: [1.0, 1.0, 1.0]
  periodic: false              # the plates end on the boundary of the box
seed: 1
voxels:
  voxel_size: 0.00625          # 160^3: the thinnest plate, 0.039 / 400^0.3 = 0.0065 here
outputs:
  directory: out/scale_rich_plates
  name: plates
  geometry: [json]
  image: [vti]
analysis: [volume_fraction, specific_surface, connectivity]
