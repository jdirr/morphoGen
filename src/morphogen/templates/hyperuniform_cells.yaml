# A disordered hyperuniform closed-cell structure: the walls (a grain-boundary phase) of
# the Voronoi cells of stealthy hyperuniform germs (the collective coordinates of
# Torquato and coworkers: S(k) = 0 for the wave vectors of the box up to the radius that
# constrains 30 % of the degrees of freedom). Its cells are about ten times more regular
# than those of Poisson germs (the coefficient of variation of their volumes 0.04 against
# 0.42), while the structure has no long-range order.
model:
  type: voronoi
  n_cells: 200
  germs: stealthy
  stealthiness: 0.3
  boundary_thickness: 0.02
domain:
  size: 1.0
  periodic: true
seed: 2004
voxels:
  shape: 96
outputs:
  directory: out/hyperuniform_cells
  name: cells
  image: [vti]
  labels: [vti]
analysis: [volume_fraction, specific_surface, cells]
