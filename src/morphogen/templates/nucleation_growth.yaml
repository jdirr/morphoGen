# Johnson-Mehl polycrystal: grains nucleate at a constant rate in the untransformed volume
# and grow at constant velocity until impingement (Johnson-Mehl-Avrami-Kolmogorov). The
# run manifest (run.json) gives the theory: Avrami exponent 4, grain density and mean
# grain volume. Set 'time' for a partial transformation (grains in a matrix),
# growth_shape: cube for faceted grains, coarsening_steps for normal grain growth.
model:
  type: nucleation_growth
  nucleation: continuous       # or site_saturation (nucleus_density: Voronoi grains)
  nucleation_rate: 0.0001      # nuclei per unit volume and unit time
  growth_rate: 1.0
  crystal_orientations: true
domain:
  size: 64.0
  periodic: true
  unit: um
seed: 1939
voxels:
  shape: 64                    # cell_size 1: one voxel per cell
outputs:
  directory: out/nucleation_growth
  name: grains
  geometry: [json]             # lattice, labels, orientations, nucleation times, kinetics
  labels: [vti]                # grain ids
  image: [vti]
analysis: [cells]
